<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#033A20">
<title>منيو هفنلي · Heavenly Menu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo_h.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap');
:root{--g:#06402A;--g2:#0B5532;--gd:#012C18;--b:#F4EBDD;--b2:#FBF5EA;--gold:#D9AE66;--gold2:#EBC987;--ink:#0B3F27}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:62px}
body{background:var(--b);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.dsp{font-family:'El Messiri','IBM Plex Sans Arabic',sans-serif}
.lat{font-family:'Cormorant Garamond',Georgia,serif}
.num{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;direction:ltr;unicode-bidi:isolate;font-variant-numeric:lining-nums}
html[lang=en] .dsp{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.01em}
html[lang=en] body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}

/* hero */
.hero{position:relative;background:radial-gradient(ellipse 90% 70% at 50% 28%,var(--g2),var(--g) 55%,var(--gd));color:var(--b);text-align:center;padding:22px 20px 0;overflow:hidden}
.lang{position:absolute;top:16px;inset-inline-end:16px;display:flex;padding:3px;border-radius:999px;background:rgba(1,44,24,.75);box-shadow:0 0 0 1px var(--gold);z-index:3}
.lang button{border:0;background:none;color:var(--b);font:600 14px 'IBM Plex Sans Arabic',sans-serif;padding:6px 13px;border-radius:999px;cursor:pointer;min-width:44px}
.lang button.on{background:linear-gradient(180deg,#F1D58F,#C79A45);color:var(--gd)}
.hero .h{width:50px;margin:12px auto 0;display:block}
.hero .lg{width:190px;margin:12px auto 0;display:block}
.hero .t{font-size:40px;font-weight:700;margin-top:8px;background:linear-gradient(180deg,#F6DFA6,#C99A45);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.25}
.today{display:none;align-items:center;gap:8px;margin-top:10px;padding:7px 16px;border-radius:999px;background:rgba(1,44,24,.7);box-shadow:0 0 0 1px var(--gold);font-size:14px}
.today.show{display:inline-flex}
.dot{width:9px;height:9px;border-radius:50%;background:#7BD88F;box-shadow:0 0 8px #7BD88F;flex:none}
.hero img.ban{display:block;width:100%;margin-top:16px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 22%);mask-image:linear-gradient(180deg,transparent,#000 22%)}

/* nav */
nav{position:sticky;top:0;z-index:9;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:rgba(3,58,32,.97);backdrop-filter:blur(6px);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--b);text-decoration:none;font:600 14.5px 'El Messiri','IBM Plex Sans Arabic',sans-serif;padding:6px 14px;border-radius:999px;box-shadow:0 0 0 1px rgba(217,174,102,.6);white-space:nowrap}
html[lang=en] nav a{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:500}
nav a.on{background:var(--gold2);color:var(--gd)}
.flt{display:none;justify-content:center;gap:8px;padding:14px 12px 4px;background:var(--b2)}
.flt.show{display:flex}
.flt button{font:600 14px 'IBM Plex Sans Arabic',sans-serif;border:0;border-radius:999px;padding:8px 18px;background:#E8DCC6;color:var(--ink);cursor:pointer}
.flt button.on{background:var(--g2);color:var(--b)}

/* sections */
section{padding:0 0 26px}
section.g{background:radial-gradient(ellipse 100% 50% at 50% 0,var(--g2),var(--g) 60%,var(--gd));color:var(--b)}
section.b{background:linear-gradient(180deg,var(--b2),#F0E4CF)}
.sh{position:relative}
.sh img{display:block;width:100%;height:220px;object-fit:cover;object-position:center 70%}
.sh .cap{position:absolute;inset:auto 0 0 0;padding:44px 18px 10px;text-align:center}
section.g .sh .cap{background:linear-gradient(180deg,transparent,var(--gd) 85%)}
section.b .sh .cap{background:linear-gradient(180deg,transparent,var(--b2) 85%)}
.sh .ttl{font-size:30px;font-weight:700;line-height:1.2}
section.g .sh .ttl{color:var(--gold2)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;color:var(--gold)}
.orn i{display:block;width:44px;height:1px;background:currentColor;opacity:.7}
.orn b{width:6px;height:6px;transform:rotate(45deg);background:currentColor}

/* grid cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 14px 0}
.card{position:relative;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
section.b .card{background:#FFFDF8;box-shadow:0 0 0 1px rgba(11,74,46,.10),0 6px 16px rgba(60,40,10,.07)}
section.g .card{background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(217,174,102,.32)}
.ph{position:relative;aspect-ratio:1/1;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.none{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#F6EAD0,#E4CFA8)}
section.g .ph.none{background:radial-gradient(circle at 50% 40%,#0E5A37,#03321D)}
.ph.none img{width:38%;height:auto;opacity:.85}
.new{position:absolute;top:9px;inset-inline-start:9px;padding:3px 10px;border-radius:999px;background:linear-gradient(180deg,#F1D58F,#C79A45);color:var(--gd);font-size:11.5px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.bd{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-size:16.5px;font-weight:700;line-height:1.3}
html[lang=en] .nm{font-size:19px}
.sub{font-size:12px;opacity:.72;line-height:1.55}
.ft{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.pr{display:flex;align-items:baseline;gap:4px}
.pr .num{font-size:22px;line-height:1}
section.g .pr .num{color:var(--gold2)}
section.b .pr .num{color:var(--g2)}
.pr small{font-size:10px;opacity:.6;letter-spacing:.06em}
.st{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;display:none}
.on-av .st{display:inline-block}
.st.y{background:rgba(123,216,143,.18);color:#1E8A43} section.g .st.y{color:#8FE3A2}
.st.n{background:rgba(0,0,0,.06);color:#8A7F70} section.g .st.n{background:rgba(255,255,255,.08);color:#CDBFA7}
.card.off .ph,.card.off .nm,.card.off .num{filter:grayscale(1);opacity:.45}
.card.off .nm{text-decoration:line-through;text-decoration-thickness:1px}
.card.w{grid-column:1/-1;flex-direction:row}
.card.w .ph{width:44%;flex:none}
.card.w .bd{padding:14px}
.fl{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.fl span{font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(11,74,46,.07)}
section.g .fl span{background:rgba(255,255,255,.09)}
.fl span.x{text-decoration:line-through;opacity:.45}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:14px 14px 0}
.chip{font:500 13.5px 'El Messiri','IBM Plex Sans Arabic',sans-serif;padding:6px 12px;border-radius:999px}
html[lang=en] .chip{font-family:'IBM Plex Sans Arabic',sans-serif}
section.g .chip{background:rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(217,174,102,.4)}
section.b .chip{background:#FFFDF8;box-shadow:0 0 0 1px rgba(11,74,46,.15)}
.note{font-size:13px;font-weight:600;padding:16px 18px 0;text-align:center;opacity:.85}
body.only-av .card.off,body.only-av .chips.off,body.only-av .note.off{display:none}
body.only-av section.empty{display:none}

footer{background:var(--gd);color:var(--b);text-align:center;padding:28px 18px 40px}
footer .wa{display:inline-block;margin-top:14px;padding:11px 28px;border-radius:999px;background:linear-gradient(180deg,#F1D58F,#C79A45);color:var(--gd);font-weight:700;text-decoration:none}
footer p{font-size:13px;opacity:.82;margin-top:12px;line-height:1.8}
</style>
</head>
<body>
<header class="hero">
  <div class="lang" role="group" aria-label="Language"><button data-l="ar">عربي</button><button data-l="en">EN</button></div>
  <img class="h" src="logo_h.png" alt="H">
  <img class="lg" id="lg" src="logo_ar.png" alt="Heavenly">
  <div class="t dsp" id="t">المنيو</div>
  <div><div class="today" id="today"><span class="dot"></span><span id="todayTx"></span></div></div>
  <img class="ban" src="cover.webp" alt="">
</header>
<nav id="nav"></nav>
<div class="flt" id="flt"><button class="on" data-f="all"></button><button data-f="av"></button></div>
<main id="menu"></main>
<footer>
  <img id="lgf" src="logo_en.png" alt="Heavenly" style="width:170px">
  <div><a class="wa" href="https://wa.me/967771816616" id="wa"></a></div>
  <p id="fp"></p>
</footer>
<script>
/* [id, ar, en, price, img, subAr, subEn, isNew, flavours[[id,ar,en]]] */
const M=[
 {id:"waffles",c:"b",ar:"الوافل والبان كيك",en:"Waffles & Pancakes",img:"waffles",items:[
  {id:"waffle",ar:"وافل",en:"Waffle",p:"4,000",img:"waffle"},
  {id:"pancake",ar:"بان كيك",en:"Pancakes",p:"3,500",img:"pancake"}],
  chips:[["الكلاسيك","The Classic"],["جولدن بيسكوف","Golden Biscoff"],["كندر لوكس","Kinder Luxe"],["بانوفي كرمبل","Banoffee Crumble"],["كوكيز آند كريم","Cookies & Cream"],["دبي شوكولاتة <bdi dir=ltr>+700</bdi>","Dubai Chocolate +700"]],chipsFor:["waffle","pancake"]},
 {id:"cheese",c:"g",ar:"التشيز كيك",en:"Cheesecakes",img:"cheese",items:[
  {id:"cheese_lotus",ar:"لوتس لودد",en:"Loaded Lotus",p:"3,800"},
  {id:"cheese_snickers",ar:"سنيكرز كرنش",en:"Snickers Crunch",p:"3,800"},
  {id:"cheese_kinder",ar:"كندر دريم",en:"Kinder Dream",p:"3,800"},
  {id:"cheese_blue",ar:"بلوبيري بليس",en:"Blueberry Bliss",p:"3,500",img:"cheese_blue"},
  {id:"cheese_straw",ar:"ستروبيري سنسيشن",en:"Strawberry Sensation",p:"3,500",img:"cheese_straw"},
  {id:"cheese_oreo",ar:"أوريو كرَش",en:"Crushed Oreo",p:"3,500",img:"cheese_oreo"},
  {id:"ss",ar:"سان سيباستيان",en:"San Sebastián",p:"4,000",img:"ss",sa:"مع الشوكولاتة البلجيكية",se:"With Belgian chocolate",w:1}]},
 {id:"cakes",c:"b",ar:"الكيك والمخبوزات",en:"Cakes & Bakes",img:"cakes",items:[
  {id:"delight",ar:"تشوكليت ديلايت",en:"Chocolate Delight",p:"4,500",img:"delight",nw:1},
  {id:"dolci",ar:"دوليتشي",en:"Dolci",p:"3,500",img:"dolci"},
  {id:"rv",ar:"سلايس ريد فلفت",en:"Red Velvet Slice",p:"2,300",img:"rv"},
  {id:"deluxe",ar:"سلايس ديلوكس",en:"Deluxe Slice",p:"2,300",img:"deluxe"},
  {id:"cdough",ar:"كوكي دو وآيس كريم",en:"Cookie Dough & Ice Cream",p:"4,000",img:"cdough"},
  {id:"brookie",ar:"بروكي",en:"Brookie",p:"1,500"},
  {id:"cookie",ar:"كوكي كلاسيك",en:"Classic Cookie",p:"900",img:"cookie"},
  {id:"stuffed",ar:"كوكي محشي",en:"Stuffed Cookie",p:"1,300",img:"stuffed"},
  {id:"donut_glazed",ar:"دونات جليز",en:"Glazed Donut",p:"1,300",img:"donut"},
  {id:"donuts",ar:"دونات أوريو وسنيكرز",en:"Oreo & Snickers Donuts",p:"1,500",fl:[["donut_oreo","أوريو","Oreo"],["donut_snickers","سنيكرز","Snickers"]]},
  {id:"muffins",ar:"مفن",en:"Muffins",p:"2,000",img:"muffin",w:1,fl:[["muffin_choc","دبل شوكولاتة","Double Chocolate"],["muffin_blue","بلوبيري","Blueberry"],["muffin_straw","فراولة","Strawberry"]]}]},
 {id:"drinks",c:"g",ar:"المشروبات والآيس كريم",en:"Drinks & Ice Cream",img:"drinks",items:[
  {id:"shakes",ar:"ميلك شيك",en:"Milkshakes",p:"5,500",img:"shake",fl:[["shake_snickers","سنيكرز","Snickers"],["shake_oreo","أوريو","Oreo"],["shake_kinder","كندر","Kinder"]]},
  {id:"icecream",ar:"آيس كريم",en:"Ice Cream",p:"1,700",img:"icecream"},
  {id:"bubble",ar:"بابل تي",en:"Bubble Tea",p:"4,000",img:"bubble",w:1,sa:"فراولة ليتشي · مانجو باشن · خوخ فراولة · ليتشي مانجو · ليتشي تفاح أخضر · خوخ شمام",se:"Strawberry Lychee · Mango Passion · Peach Strawberry · Lychee Mango · Lychee Green Apple · Peach Melon"},
  {id:"mojito",ar:"موهيتو",en:"Mojito",p:"2,500",img:"mojito",w:1,sa:"بيري بلوسم · بيتشي بارادايس · تروبيكال تويست · سنست سبلاش · سمر بوب",se:"Berry Blossom · Peachy Paradise · Tropical Twist · Sunset Splash · Summer Pop"}]},
 {id:"savoury",c:"b",ar:"المالح",en:"Savoury",img:"savoury",items:[
  {id:"kebab",ar:"كباب بالدجاج",en:"Chicken Kebab",p:"4,500",img:"kebab"},
  {id:"samosa",ar:"سمبوسة",en:"Samosa",p:"1,000",img:"samosa"},
  {id:"pocket",ar:"جيب هفنلي",en:"Heavenly Pocket",p:"1,700",img:"pocket",w:1,sa:"نقانق · تونة · خضار وجبن",se:"Sausage · Tuna · Veggie & Cheese"}]}
];
const T={
 ar:{t:"المنيو",all:"كل المنيو",av:"المتوفر اليوم",y:"● متوفر اليوم",n:"غير متوفر اليوم",today:"متوفر اليوم",cur:"ريال",fl:"النكهات",nw:"جديد",wa:"اطلب عبر واتساب · 771 816 616",
  fp:'صباحاً <bdi dir="ltr">8:00 – 12:30</bdi> · مساءً <bdi dir="ltr">4:00 – 10:00</bdi><br>الجمعة مساءً فقط · مغلق بين المغرب والعشاء<br>قسم نسائي خاص<br>📍 تريم – الروضة – بحري دار الزهراء<br>الأسعار بالريال اليمني'},
 en:{t:"The Menu",all:"Full Menu",av:"Available Today",y:"● Available",n:"Not today",today:"Available today",cur:"YER",fl:"Flavours",nw:"NEW",wa:"Order on WhatsApp · 771 816 616",
  fp:'Morning <bdi dir="ltr">8:00 – 12:30</bdi> · Evening <bdi dir="ltr">4:00 – 10:00</bdi><br>Friday: evening only · Closed between Maghrib & Isha<br>Private ladies’ section<br>📍 Tarim – Al-Rawdah, north of Dar Al-Zahra<br>Prices in Yemeni Rial (YER)'}
};
let L='ar',AV=null,DAY=null;
try{L=localStorage.getItem('hl_lang')||'ar'}catch(e){}
if(L!=='en')L='ar';
const has=id=>!AV||AV.includes(id);
function render(){
  const t=T[L],E=L==='en';
  document.documentElement.lang=L;document.documentElement.dir=E?'ltr':'rtl';
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
  document.getElementById('lg').src=E?'logo_en.png':'logo_ar.png';
  document.getElementById('lgf').src=E?'logo_ar.png':'logo_en.png';
  document.getElementById('t').textContent=t.t;
  const td=document.getElementById('today');td.classList.toggle('show',!!AV);
  document.getElementById('todayTx').textContent=AV?t.today+' · '+(E?DAY.en:DAY.ar):'';
  const f=document.getElementById('flt');f.classList.toggle('show',!!AV);
  f.children[0].textContent=t.all;f.children[1].textContent=t.av;
  document.body.classList.toggle('on-av',!!AV);
  document.getElementById('wa').textContent=t.wa;document.getElementById('fp').innerHTML=t.fp;
  let html='',nav='';
  for(const s of M){
    nav+=`<a href="#${s.id}">${E?s.en:s.ar}</a>`;
    let cards='',any=false;
    for(const it of [...s.items].sort((a,b)=>((a.w?2:0)+(!a.img))-((b.w?2:0)+(!b.img)))){
      const ok=it.fl?it.fl.some(x=>has(x[0])):has(it.id); any=any||ok;
      const ph=it.img?`<div class="ph"><img src="${it.img}.webp" alt="">${it.nw?`<span class="new">${t.nw}</span>`:''}</div>`:`<div class="ph none"><img src="logo_h.png" alt=""></div>`;
      const sub=(E?it.se:it.sa)?`<div class="sub">${E?it.se:it.sa}</div>`:'';
      const fl=it.fl?`<div class="fl">${it.fl.map(x=>`<span class="${has(x[0])?'':'x'}">${E?x[2]:x[1]}</span>`).join('')}</div>`:'';
      cards+=`<div class="card${it.w?' w':''}${ok?'':' off'}">${ph}<div class="bd"><div class="nm dsp">${E?it.en:it.ar}</div>${sub}${fl}<div class="ft"><div class="pr"><span class="num">${it.p}</span><small>${t.cur}</small></div><span class="st ${ok?'y':'n'}">${ok?t.y:t.n}</span></div></div></div>`;
    }
    let chips='';
    if(s.chips){const ok=s.chipsFor.some(has);chips=`<div class="note${ok?'':' off'}">${t.fl}</div><div class="chips${ok?'':' off'}">${s.chips.map(c=>`<span class="chip">${E?c[1]:c[0]}</span>`).join('')}</div>`;}
    html+=`<section class="${s.c}${any?'':' empty'}" id="${s.id}"><div class="sh"><img src="${s.img}.webp" alt=""><div class="cap"><div class="ttl dsp">${E?s.en:s.ar}</div><div class="orn"><i></i><b></b><i></i></div></div></div><div class="grid">${cards}</div>${chips}</section>`;
  }
  document.getElementById('menu').innerHTML=html;document.getElementById('nav').innerHTML=nav;
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('hl_lang',L)}catch(e){}render()});
document.querySelectorAll('.flt button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.flt button').forEach(x=>x.classList.toggle('on',x===b));document.body.classList.toggle('only-av',b.dataset.f==='av')});
render();
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function apply(d){ const k=iso(new Date()); if(d&&d.days&&d.days[k])d=Object.assign({date:k},d.days[k]); if(d&&d.date===k){AV=d.available;DAY={ar:d.date_ar,en:d.date_en||d.date};}else{AV=null;} render(); }
fetch('menu.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(apply).catch(()=>{});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
